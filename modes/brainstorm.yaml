# Idea generation among an ad hoc roster of agent-template instances (M2.11)
mode: brainstorm
floor_policy: round-robin
moderator: null
roles:
  # The orchestrator sends as "moderator" (turn assignments) and as "human" (interjections, the stop
  # record). Without these explicit entries both fell under "*", which does not allow those kinds,
  # so the first turn grant of every session in this mode failed with a PermissionError.
  moderator:
    may_send: [assignment, summary, note]
  human:
    may_send: [note, x-stop]
  "*":
    may_send: [note, question, answer, x-hand-raise]
route: {}
stop_rules:
  max_rounds: 6
  converge_after_quiet_rounds: 2
  stale_argument_turns: 3
  urgency_boost_multiplier: 1.3
  max_consecutive_grants: 2
  urgency_boost_reasons: [new_point, disagree]
synthesis_prompt_hint: >
  Group the ideas raised into clusters of genuinely similar/overlapping ideas (not one
  cluster per idea). Rank clusters by a combination of feasibility (realistic given stated
  constraints) and novelty/value (meaningfully addresses the brief). For top-ranked clusters,
  name the strongest individual idea within that cluster. Don't discard a single-mention idea
  for low popularity if the idea itself is strong -- consolidate for repetition, not for
  popularity.
phases:
  - name: diverge
    description: "Generate as many distinct ideas as possible. No criticism allowed."
    max_rounds: 2
    floor_policy: round-robin
  - name: cluster
    description: "Discuss how to group the generated ideas into logical clusters."
    max_rounds: 2
    floor_policy: raise-hand
  - name: synthesize
    description: "Final clustering and ranking."
    max_rounds: 1
    floor_policy: round-robin
