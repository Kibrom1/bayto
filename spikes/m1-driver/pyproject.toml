[project]
name = "bayto-m1-driver"
version = "0.1.0"
description = "M1.10 spike: Python floor-loop driver (sbx lifecycle + raise-hand scoring + moderator summary), pre-M2, no orchestrator/ dependency"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "anthropic>=0.40",
    "acp",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv.sources]
acp = { path = "../../agent-comms", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m1_driver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
