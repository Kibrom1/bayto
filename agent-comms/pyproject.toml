[project]
name = "acp"
version = "0.1.0"
description = "Bayto agent communication protocol (acp/1)"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.20"]

[project.scripts]
acp = "acp.cli:main"
handoff = "acp.handoff_compat:main"
crew-notify-fallback = "acp.crew_notify_fallback:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
