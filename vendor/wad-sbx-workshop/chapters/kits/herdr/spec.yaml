schemaVersion: "2"
kind: mixin
name: workshop-herdr
description: Add Herdr session control to the assistants already installed.
args:
  herdr_version:
    default: "0.9.0"
permissions:
  network:
    allow: [github.com, release-assets.githubusercontent.com, objects.githubusercontent.com]
setup:
  install:
    - user: agent
      command: |
        set -eu
        mkdir -p "$HOME/.local/bin"
        case "$(uname -m)" in aarch64|arm64) arch=aarch64;; x86_64|amd64) arch=x86_64;; *) exit 1;; esac
        curl -fsSL "https://github.com/herdrdev/herdr/releases/download/v${{ kit.args.herdr_version }}/herdr-linux-$arch" -o "$HOME/.local/bin/herdr"
        chmod +x "$HOME/.local/bin/herdr"
        herdr --version
