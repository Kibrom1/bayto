name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bayto
          POSTGRES_PASSWORD: bayto
          POSTGRES_DB: bayto
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bayto" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BAYTO_REQUIRE_DB: "1"   # database tests fail instead of skipping
      DATABASE_URL: postgresql+psycopg://bayto:bayto@localhost:5432/bayto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "agent-comms[dev]"
          pip install -e "orchestrator[dev]"
      - name: Test orchestrator
        working-directory: orchestrator
        run: python -m pytest -q
      - name: Test agent-comms
        working-directory: agent-comms
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
